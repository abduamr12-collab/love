<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بحبك</title>
<style>
body{background:#0f0f12;color:white;text-align:center;font-family:Arial}
#heart{position:relative;width:360px;height:330px;margin:20px auto}
.word{position:absolute;transform:translate(-50%,-50%) scale(0);white-space:nowrap;font-weight:900;transition:0.4s}
.word.show{transform:translate(-50%,-50%) scale(1)}
#btn{padding:16px 35px;border:none;border-radius:50px;background:#ff2e63;color:white;font-size:22px;cursor:pointer}
</style>
</head>
<body>
<h1>بحبك بكل لغات العالم</h1>
<button id="btn">اضغط هنا</button>
<div id="heart"></div>
<script>
var words=["بحبك","I LOVE YOU","TE AMO","TI AMO","SARANGHAE","WO AI NI","MAHAL KITA"];
var colors=["#ff2e63","#ff6b9d","#ffd166","#ffffff","#ff9f43"];
var heart=document.getElementById("heart");
var btn=document.getElementById("btn");
var points=[];
for(var i=0;i<120;i++){
  var t=Math.random()*6.28;
  var x=16*Math.pow(Math.sin(t),3);
  var y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
  var px=180+(x/16)*165;
  var py=165-(y/16)*150;
  var r=Math.sqrt(Math.random());
  px=180+(px-180)*r;
  py=165+(py-165)*r;
  points.push({x:px,y:py});
}
btn.addEventListener("click",function(){
  btn.style.display="none";
  var idx=0;
  var timer=setInterval(function(){
    if(idx>=points.length){clearInterval(timer);return;}
    var span=document.createElement("div");
    span.className="word";
    span.textContent=words[idx%words.length];
    span.style.left=points[idx].x+"px";
    span.style.top=points[idx].y+"px";
    span.style.color=colors[idx%colors.length];
    span.style.fontSize="16px";
    heart.appendChild(span);
    setTimeout(function(){span.classList.add("show");},10);
    idx++;
  },60);
});
</script>
</body>
</html>
