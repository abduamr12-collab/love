<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختاري كارت</title>
<style>
body{background:#0f0f12;color:white;text-align:center;font-family:Arial;padding:20px}
h1{font-size:30px}
p{color:#ffb3c6;margin:10px}
.cards{display:flex;gap:12px;justify-content:center;margin-top:20px}
.card{
  width:110px;height:170px;background:#ff2e63;border-radius:15px;
  display:flex;align-items:center;justify-content:center;
  font-size:50px;cursor:pointer;user-select:none;
}
.card.open{background:white;color:#ff2e63;font-size:18px;font-weight:bold;padding:10px}
#msg{margin-top:20px;font-size:24px;display:none;color:#ffd166}
</style>
</head>
<body>
<h1>اختاري كارت 🃏</h1>
<p>دوسي على أي كارت</p>
<div class="cards">
  <div class="card">❤️</div>
  <div class="card">❤️</div>
  <div class="card">❤️</div>
</div>
<div id="msg">مبروك كسبتي قلب عبدو كله ❤️</div>
<script>
var cards = document.querySelectorAll(".card");
var done = false;
for(var i=0;i<cards.length;i++){
  cards[i].addEventListener("click", function(){
    if(done) return;
    done = true;
    this.classList.add("open");
    this.textContent = "كسبتي قلب عبدو كله ❤️";
    document.getElementById("msg").style.display = "block";
    alert("مبروك ❤️");
  });
}
</script>
</body>
</html>
